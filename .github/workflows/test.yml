name: Test

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: multi-query-opener/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: multi-query-opener
      - name: Run tests
        run: npm test
        working-directory: multi-query-opener
